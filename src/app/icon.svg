<!--
  Ikon Favicon Aplikasi Web Portofolio.
  Tujuan: Menampilkan logo simbol resmi (Spark Pivot) dengan gaya Neo-Brutalisme yang tajam dan presisi pada browser tab.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Bayangan keras (Hard Shadow) khas Neo-Brutalism -->
  <rect x="74" y="74" width="374" height="374" rx="80" fill="#000000" />
  
  <!-- Kotak Kuning Utama dengan Border Hitam Tebal -->
  <rect x="54" y="54" width="374" height="374" rx="80" fill="#FFD60A" stroke="#000000" stroke-width="20" stroke-linejoin="round" />
  
  <!-- Bar Data Kiri (Input / Raw Data) -->
  <rect x="124" y="220" width="50" height="138" rx="15" fill="#000000" />
  
  <!-- Bar Data Tengah (Analytics / Decision) -->
  <rect x="198" y="152" width="50" height="206" rx="15" fill="#2563EB" stroke="#000000" stroke-width="10" />
  
  <!-- AI Sparkle Star Kanan (Vibecoding / AI Innovation) -->
  <path d="M 326 84 Q 326 142 268 142 Q 326 142 326 200 Q 326 142 384 142 Q 326 142 326 84 Z" fill="#FF006E" stroke="#000000" stroke-width="10" stroke-linejoin="round" />
  
  <!-- Titik Jangkar / Anchor Dot -->
  <circle cx="326" cy="300" r="22" fill="#000000" />
</svg>
